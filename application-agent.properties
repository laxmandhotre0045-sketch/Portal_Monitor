# =====================================================================
#  Portal Monitor - AGENT configuration  (the Windows Docker machine)
#
#  Put next to the jar, e.g. C:\portal-monitor\application.properties
#  Edit every line marked "<-- CHANGE".
#
#  The agent needs NO database access and NO SMTP settings. It only runs
#  `docker ps` and POSTs the result to the server.
# =====================================================================

# =====================  WHERE TO REPORT  =============================
# The server's public HTTPS address. Either the base URL or the full
# endpoint works; /api/agent/report is appended when it is missing.
agent.serverUrl=https://monitor.yourdomain.com
# <-- CHANGE to your VPS domain (or http://VPS_IP:8085 if you skip nginx)

# Must match api.token in the server's application.properties exactly
agent.token=11635969e5caffdb7fbcfd41289aa4769f0d6d3aa0a365521833e5ea95b9f294
# <-- CHANGE

# Identifies this host in the database and in the alert emails
agent.id=windows-docker-01
# How often to run docker ps and report, in seconds.
# Keep this well below the server's agent.offlineAfterSeconds.
agent.intervalSeconds=60

# The docker executable. Change only if it is not on the service PATH,
# e.g. C:\\Program Files\\Docker\\Docker\\resources\\bin\\docker.exe
# (backslashes must be doubled in a .properties file)
agent.dockerCommand=docker

# =====================  TIMEOUTS  ====================================
# Used for the POST to the server
check.connectTimeoutSeconds=5
check.requestTimeoutSeconds=10

# =====================  GENERAL  =====================================
app.timezone=Asia/Kolkata

# No db.* and no smtp.* settings are needed here. The agent holds no
# database credentials and no mailbox password, which is the point of
# splitting it from the server.
