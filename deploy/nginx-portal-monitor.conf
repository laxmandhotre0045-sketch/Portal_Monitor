# nginx site for Portal Monitor
#
# The Java app listens on 127.0.0.1:8085 and is never exposed directly.
# nginx terminates HTTPS so the agent's token never crosses the internet
# in clear text.
#
# Install:
#   sudo cp nginx-portal-monitor.conf /etc/nginx/sites-available/portal-monitor
#   sudo ln -s /etc/nginx/sites-available/portal-monitor /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get a certificate. certbot rewrites this file to add the ssl block:
#   sudo certbot --nginx -d monitor.yourdomain.com
#
# REPLACE monitor.yourdomain.com throughout.

server {
    listen 80;
    listen [::]:80;
    server_name monitor.yourdomain.com;   # <-- CHANGE

    # certbot serves its challenge from here and redirects the rest to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monitor.yourdomain.com;   # <-- CHANGE

    # certbot fills these in with  sudo certbot --nginx -d monitor.yourdomain.com
    ssl_certificate     /etc/letsencrypt/live/monitor.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The agent posts a JSON list of ~31 containers; this is generous.
    client_max_body_size 2m;

    access_log /var/log/nginx/portal-monitor.access.log;
    error_log  /var/log/nginx/portal-monitor.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # ---- the agent posts here every 60s ----
    location /api/agent/report {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app answers before evaluating, so this only needs to cover the POST itself.
        proxy_read_timeout 30s;
    }

    # ---- read-only status, same token ----
    location /api/status {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Optional: only your office and the VPS may read the status.
        # allow 203.0.113.45;
        # allow 198.51.100.0/24;
        # deny all;
    }

    # ---- open liveness probe, so the monitor itself can be monitored ----
    location = /health {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Nothing else is served from this host.
    location / {
        return 404;
    }
}
