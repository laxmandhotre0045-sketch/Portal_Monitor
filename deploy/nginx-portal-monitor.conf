# nginx site for Portal Monitor
#
# The Java app listens on 127.0.0.1:8085 and is never exposed directly.
# nginx terminates HTTPS so the agent's token never crosses the internet
# in clear text.
#
# This file deliberately contains ONLY a port-80 server. That way it loads
# before any certificate exists (a 443 block pointing at missing certificate
# files makes `nginx -t` fail). certbot then adds the 443 block, the
# certificate paths, and the HTTP -> HTTPS redirect by itself.
#
# Works on Ubuntu 24.04's nginx 1.24 (no `http2 on;`, which needs 1.25.1+).
#
# Install - REPLACE monitor.yourdomain.com below first:
#   sudo cp nginx-portal-monitor.conf /etc/nginx/sites-available/portal-monitor
#   sudo ln -s /etc/nginx/sites-available/portal-monitor /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx --redirect -d monitor.yourdomain.com
#
# The domain's DNS A record must already point at this VPS, and ports 80
# and 443 must be open:  sudo ufw allow 'Nginx Full'

server {
    listen 80;
    listen [::]:80;
    server_name monitor.yourdomain.com;   # <-- CHANGE

    # The agent posts a JSON list of ~31 containers; this is generous.
    client_max_body_size 2m;

    access_log /var/log/nginx/portal-monitor.access.log;
    error_log  /var/log/nginx/portal-monitor.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # ---- the agent posts here every 60s ----
    location = /api/agent/report {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app answers before evaluating, so this only needs to cover the POST itself.
        proxy_read_timeout 30s;
    }

    # ---- read-only status, same token ----
    location = /api/status {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Optional: only your office and the VPS may read the status.
        # allow 203.0.113.45;
        # deny all;
    }

    # ---- open liveness probe, so the monitor itself can be monitored ----
    location = /health {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Nothing else is served from this host. (certbot adds its own
    # /.well-known/acme-challenge/ handling during issuance and renewal.)
    location / {
        return 404;
    }
}
